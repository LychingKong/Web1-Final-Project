<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/search.js"></script>
</head>

<body class="bg-white">
  <!-- Header Component -->
  <div id="header-component">
    <!-- Header content will be loaded here by JavaScript -->
  </div>
  <script>
    // Load header component
    fetch('../components/header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-component').outerHTML = html;
      })
      .catch(error => console.error('Error loading header:', error));
  </script>

  <div class="max-w-7xl mx-auto px-4 py-12">

  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900">Necklaces</h1>
    <p class="text-gray-600 mt-2">Statement pieces designed to inspire elegance.</p>
  </div>

  <section class="relative bg-gradient-to-r from-rose-50 to-amber-50 rounded-2xl overflow-hidden mb-16">
        <div class="grid grid-cols-1 md:grid-cols-2 items-center">
          <div class="p-8 md:p-12 lg:p-16">
            <span class="text-sm font-semibold text-amber-600 uppercase tracking-wider">New Collection</span>
            <h2 class="mt-2 text-4xl md:text-5xl font-bold text-gray-900 leading-tight">
              Radiant <span class="text-amber-700">Diamond</span> Elegance
            </h2>
            <p class="mt-4 text-lg text-gray-600 max-w-lg">
              Handcrafted with ethically sourced diamonds and 18k gold. Designed to celebrate your most precious moments.
            </p>
            <div class="mt-8 flex flex-wrap gap-4">
              <a href="#" class="bg-amber-700 hover:bg-amber-800 text-white font-medium px-6 py-3 rounded-full shadow-md transition">
                Shop Now
              </a>
              <a href="#" class="border border-gray-400 text-gray-700 hover:bg-gray-50 font-medium px-6 py-3 rounded-full transition">
                View Collection
              </a>
            </div>
          </div>
          <div class="hidden md:block">
            <img 
              src="https://images.unsplash.com/photo-1608228088998-57828365d480?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&h=600&q=80" 
              alt="Diamond Necklace"
              class="w-full h-full object-cover"
            >
          </div>
        </div>
      </section>

      <!-- Filters -->
  <div class="flex flex-wrap gap-4 justify-end mb-8">
    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Sort by</option>
      <option>Price (Low → High)</option>
      <option>Price (High → Low)</option>
      <option>Newest</option>
    </select>

    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Metal Type</option>
      <option>Gold</option>
      <option>White Gold</option>
      <option>Rose Gold</option>
    </select>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

    <div class="bg-white shadow-sm rounded-xl p-4 hover:shadow-lg transition text-center">
      <img src="https://images.unsplash.com/photo-1605348532760-67e32d9c4b60?auto=format&fit=crop&w=300&q=80"
           class="h-48 mx-auto object-contain">
      <h3 class="mt-3 font-semibold text-gray-900">Celestial Pendant</h3>
      <p class="text-amber-700 font-bold">$299</p>
    </div>

  </div>

</div>

</body>
</html>
