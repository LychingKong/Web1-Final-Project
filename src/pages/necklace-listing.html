<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/search.js"></script>
</head>

<body class="bg-white">

  <!-- Header Component -->
  <div id="header-component">
    <!-- Header content will be loaded here by JavaScript -->
  </div>
  <script>
    // Load header component
    fetch('../components/header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-component').outerHTML = html;
      })
      .catch(error => console.error('Error loading header:', error));
  </script>

  <div class="max-w-7xl mx-auto px-4 py-12">

  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900">Necklaces</h1>
    <p class="text-gray-600 mt-2">Statement pieces designed to inspire elegance.</p>
  </div>

      <!-- Filters -->
  <div class="flex flex-wrap gap-4 justify-end mb-8">
    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Sort by</option>
      <option>Price (Low → High)</option>
      <option>Price (High → Low)</option>
      <option>Newest</option>
    </select>

    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Metal Type</option>
      <option>Gold</option>
      <option>White Gold</option>
      <option>Rose Gold</option>
    </select>
  </div>

  <!-- Grid populated via JS -->
  <div id="necklace-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>

  </div>

  <script src="../js/category-listing.js"></script>

</body>
</html>
