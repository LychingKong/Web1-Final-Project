<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/search.js"></script>
</head>

<body class="bg-white">
  <!-- Header Component -->
  <div id="header-component">
    <!-- Header content will be loaded here by JavaScript -->
  </div>
  <script>
    // Load header component
    fetch('../components/header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-component').outerHTML = html;
      })
      .catch(error => console.error('Error loading header:', error));
  </script>

  <div class="max-w-7xl mx-auto px-4 py-12">

  <div class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900">Collections</h1>
    <p class="text-gray-600 mt-2">Browse our elegant and timeless jewelry collections.</p>
  </div>

  <!-- Rings Section -->
  <section class="mb-16">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Rings</h2>
      <a href="ring-listing" class="text-amber-700 hover:text-amber-800 text-sm font-medium">View All →</a>
    </div>
    <div id="rings-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
      <!-- Rings will be dynamically inserted here -->
      <div class="text-center py-8">
        <div class="animate-pulse">
          <div class="h-48 bg-gray-200 rounded-lg mb-3"></div>
          <div class="h-4 bg-gray-200 rounded w-3/4 mx-auto mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Necklaces Section -->
  <section class="mb-16">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Necklaces</h2>
      <a href="necklace-listing" class="text-amber-700 hover:text-amber-800 text-sm font-medium">View All →</a>
    </div>
    <div id="necklaces-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
      <!-- Necklaces will be dynamically inserted here -->
      <div class="text-center py-8">
        <div class="animate-pulse">
          <div class="h-48 bg-gray-200 rounded-lg mb-3"></div>
          <div class="h-4 bg-gray-200 rounded w-3/4 mx-auto mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bracelets Section -->
  <section>
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Bracelets</h2>
      <a href="bracelet-listing" class="text-amber-700 hover:text-amber-800 text-sm font-medium">View All →</a>
    </div>
    <div id="bracelets-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
      <!-- Bracelets will be dynamically inserted here -->
      <div class="text-center py-8">
        <div class="animate-pulse">
          <div class="h-48 bg-gray-200 rounded-lg mb-3"></div>
          <div class="h-4 bg-gray-200 rounded w-3/4 mx-auto mb-2"></div>
          <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Add the script to load products -->
  <script type="module" src="../js/populate-collections.js"></script>

</div>

</body>
</html>
