<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load search functions first -->
  <script src="../js/search.js"></script>
</head>

<body class="bg-white">
  <!-- Header Component -->
  <div id="header-component">
    <!-- Header content will be loaded here by JavaScript -->
  </div>
  <script>
    // Load header component
    (function() {
      const headerElement = document.getElementById('header-component');
      if (!headerElement) return;
      
      fetch('../components/header.html')
        .then(response => {
          if (!response.ok) throw new Error('Failed to load header');
          return response.text();
        })
        .then(html => {
          headerElement.outerHTML = html;
        })
        .catch(error => {
          console.error('Error loading header:', error);
          // Fallback header if loading fails
          headerElement.outerHTML = `
            <header class="bg-white shadow">
              <div class="flex justify-between items-center p-4">
                <a href="/" class="text-xl font-bold">Julvry</a>
                <a href="cart" class="text-gray-700">🛒 Cart</a>
              </div>
              <nav class="bg-gray-100 p-2">
                <div class="flex justify-center space-x-6">
                  <a href="/">Home</a>
                  <a href="collections">Collections</a>
                  <a href="ring-listing">Rings</a>
                  <a href="necklace-listing">Necklaces</a>
                  <a href="bracelet-listing">Bracelets</a>
                </div>
              </nav>
            </header>
          `;
        });
    })();
  </script>

  <div class="max-w-7xl mx-auto px-4 py-12">

  <div class="text-center mb-10">
    <h1 class="text-4xl font-bold text-gray-900">Rings Collection</h1>
    <p class="text-gray-600 mt-2">Timeless pieces crafted with precision and passion.</p>
  </div>

  <!-- Filters -->
  <div class="flex flex-wrap gap-4 justify-end mb-8">
    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Sort by</option>
      <option>Price (Low → High)</option>
      <option>Price (High → Low)</option>
      <option>Newest</option>
    </select>

    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Metal Type</option>
      <option>Gold</option>
      <option>White Gold</option>
      <option>Rose Gold</option>
    </select>
  </div>

  <!-- Product Grid -->
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

    <!-- Single Product -->
    <div class="group text-center">
      <div class="border rounded-xl shadow-sm p-4 hover:shadow-lg transition">
        <img src="https://images.unsplash.com/photo-1599646688950-1f076c3c8a6e?auto=format&fit=crop&w=400&q=80" 
             class="h-48 w-full object-contain" />
        <h3 class="mt-3 font-medium text-gray-900">Solitaire Diamond Ring</h3>
        <p class="text-amber-700 font-bold">$1,299</p>
      </div>
      <button class="mt-2 text-sm text-gray-600 hover:text-amber-700">Add to Wishlist</button>
    </div>

    <!-- Duplicate the card for each product -->
  </div>

</div>

</body>
</html>
