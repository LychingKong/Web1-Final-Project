<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../output.css" rel="stylesheet" />
  <link href="../css/main.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script></head>

<body class="bg-white">

  <header class="grid grid-cols-[25%_50%_25%] items-center px-0 py-6 bg-white shadow">

      <!-- Left: Logo (25%) -->
      <div class="flex items-center justify-start pl-8">
        <img src="https://via.placeholder.com/120x40?text=Logo" alt="Logo" class="h-12 w-auto">
      </div>

      <!-- Center: Title (50%) -->
      <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-800">Julvry</h1>
        <p class="text-sm text-gray-500">Elegant and Timeless Pieces</p>
      </div>

      <!-- Right: Search + Cart (25%) -->
      <div class="flex items-center justify-end pr-8 space-x-4">
        <div class="relative w-full max-w-xs">
          <input 
            type="text" 
            placeholder="Search products..." 
            class="w-full pl-4 pr-10 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-gray-400" 
          />
          <button class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
            🔍
          </button>
        </div>
        <a href="cart.html" class="text-gray-700 font-medium hover:text-gray-900">🛒 Cart</a>
      </div>

    </header>

    <!-- NAVIGATION -->
    <nav class="bg-gray-100 shadow-sm">
      <div class="flex justify-center space-x-10 py-3">
        <a href="index.html">Home</a>
        <a href="#">Collections</a>
        <a href="ring-listing.html">Rings</a>
        <a href="necklace-listing.html">Necklaces</a>
        <a href="bracelet-listing.html">Bracelets</a>
        <a href="#">About</a>
      </div>
    </nav>

<div class="max-w-7xl mx-auto px-4 py-12">

  <div class="flex flex-col md:flex-row justify-center items-center mb-10">
    <div class="text-center mb-12">
      <h1 class="text-4xl font-bold text-gray-900">Bracelets</h1>
      <p class="text-gray-600">Elegant designs for every style.</p>
    </div>
  </div>
<!-- Filters -->
  <div class="flex flex-wrap gap-4 justify-end mb-8">
    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Sort by</option>
      <option>Price (Low → High)</option>
      <option>Price (High → Low)</option>
      <option>Newest</option>
    </select>

    <select class="border rounded-full px-4 py-2 bg-white">
      <option>Metal Type</option>
      <option>Gold</option>
      <option>White Gold</option>
      <option>Rose Gold</option>
    </select>
  </div>

  <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

    <div class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition">
      <img src="https://images.unsplash.com/photo-1618336753754-9587105c4d6d?auto=format&fit=crop&w=600&q=80"
           class="h-56 w-full object-cover">
      <div class="p-4">
        <h4 class="font-semibold text-gray-900">Gold Chain Bracelet</h4>
        <p class="text-amber-700 font-bold">$349</p>
        <button class="mt-2 text-sm text-gray-600 hover:text-amber-700">Add to Wishlist</button>
      </div>
    </div>

  </div>

</div>

</body>
</html>
